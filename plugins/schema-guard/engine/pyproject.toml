[project]
name = "schema-guard"
version = "0.1.0"
description = "Deterministic safety checks for database schema changes, driven by an AI skill."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "sqlglot>=25",
    "pyyaml>=6",
    "jsonschema>=4",
]

[project.scripts]
sg = "sg.cli:main"

# Extension points. Third-party packages can register their own adapters,
# dialects, checks and rules under these groups without touching this repo.
[project.entry-points."schema_guard.adapters"]
alembic = "sg.adapters.alembic:AlembicAdapter"
raw_sql = "sg.adapters.raw_sql:RawSqlAdapter"

[project.entry-points."schema_guard.dialects"]
postgres = "sg.dialects.postgres:PostgresDialect"

[project.entry-points."schema_guard.checks"]
policy = "sg.checks.policy:PolicyCheck"
squawk = "sg.checks.squawk:SquawkCheck"
roundtrip = "sg.checks.roundtrip:RoundtripCheck"
invariants = "sg.checks.invariants:InvariantsCheck"
callers = "sg.checks.callers:CallersCheck"
tests = "sg.checks.tests:TestsCheck"

[project.entry-points."schema_guard.rules"]
float_on_money = "sg.rules.float_on_money:FloatOnMoney"
destructive_on_ledger = "sg.rules.destructive_on_ledger:DestructiveOnLedger"
mutate_posted_rows = "sg.rules.mutate_posted_rows:MutatePostedRows"
notnull_on_hot_table = "sg.rules.notnull_on_hot_table:NotNullOnHotTable"
index_not_concurrent = "sg.rules.index_not_concurrent:IndexNotConcurrent"
edit_applied_migration = "sg.rules.edit_applied_migration:EditAppliedMigration"
unbatched_backfill = "sg.rules.unbatched_backfill:UnbatchedBackfill"

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
